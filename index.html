<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS: GLOBAL COMM-LINK</title>
    
    <!-- External Library: MQTT for Browser WebSockets (This powers the global connection!) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <!-- Link to your CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- OVERLAY: LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="glass-panel">
            <h1 class="neon-title">GLOBAL NEXUS</h1>
            <p class="subtitle">Enter your alias to join the worldwide server.</p>
            <input type="text" id="username-input" placeholder="FIGHTER ALIAS" autocomplete="off" maxlength="15">
            <button class="action-btn" onclick="ChatEngine.login()">CONNECT TO SERVER</button>
        </div>
    </div>

    <!-- MAIN CHAT ROOM -->
    <div id="chat-screen" class="screen">
        <div class="chat-container">
            
            <!-- Header -->
            <header class="chat-header">
                <div class="header-info">
                    <h2>GLOBAL COMM-LINK</h2>
                    <span id="connection-status" class="status-indicator">🔴 Disconnected</span>
                </div>
                <div class="user-badge" id="my-user-badge">USER</div>
            </header>

            <!-- Message Area (Where texts appear) -->
            <main class="chat-box" id="chat-box">
                <!-- System Welcome Message -->
                <div class="message system-msg">
                    <span class="msg-text">Welcome to the Nexus Global Server. Type /roll to play the dice game.</span>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="input-area">
                <input type="text" id="msg-input" placeholder="Broadcast a message..." autocomplete="off" maxlength="200">
                <button class="send-btn" onclick="ChatEngine.sendMessage()">SEND</button>
            </footer>

        </div>
    </div>

    <!-- Link to your JS -->
    <script src="script.js"></script>
</body>
</html>
